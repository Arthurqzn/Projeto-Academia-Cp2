# ==========================================================
# Profile DEFAULT - SQL Server (local ou remoto)
# ==========================================================
# Todos os valores podem ser trocados por variaveis de ambiente.
# Para usar o banco disponibilizado pelo professor, defina DB_HOST, DB_PORT, DB_NAME, DB_USER e DB_PASSWORD.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:treino_db};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Fiap@12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# update = cria/atualiza as tabelas automaticamente. Use DDL_AUTO=none se o banco ja possui as tabelas.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
