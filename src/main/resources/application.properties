# ==========================================================
# Configuracoes comuns a todos os profiles
# ==========================================================
spring.application.name=projeto-academia-cp4

# Profile ativo por padrao (pode ser sobrescrito por SPRING_PROFILES_ACTIVE)
spring.profiles.active=default

server.port=8080

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
