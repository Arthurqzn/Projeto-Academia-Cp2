services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-treino
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fiap@12345"
    ports:
      - "14333:1433"   # porta 14333 no PC (a 1433 costuma estar bloqueada no Windows)
    volumes:
      - sqlserver_treino_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Fiap@12345' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Cria o banco treino_db (o SQL Server nao cria sozinho) e finaliza
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Fiap@12345' -C -Q \"IF DB_ID('treino_db') IS NULL CREATE DATABASE treino_db\""]

  treino-api:
    build: .
    container_name: treino-api
    restart: always
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: treino_db
      DB_USER: sa
      DB_PASSWORD: Fiap@12345
    ports:
      - "8080:8080"

volumes:
  sqlserver_treino_data: